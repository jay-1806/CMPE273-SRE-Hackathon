<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SRE Monitoring Dashboard</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>SRE Tier-0 Dashboard</h1>
                <p>Enterprise IoT Monitoring System</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="alert alert-error" id="errorAlert" style="display: none;"></div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <span id="loginText">Login</span>
                    <span id="loginSpinner" class="spinner" style="display: none;">Logging in...</span>
                </button>
            </form>

            <div class="login-footer">
                <p>Demo credentials: <strong>admin / secret</strong> or <strong>demo / secret</strong></p>
                <p class="text-muted">Hackathon Project - CMPE273 SRE</p>
            </div>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
